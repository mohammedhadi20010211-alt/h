<style>
:root{--bg:#0e1623;--bg2:#162236;--ink:#eef2f8;--mut:#9fb0c8;--line:#27364d;--acc:#2ec4b6;--hot:#ff5a4f;--card:#142033;color-scheme:dark}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 Tajawal,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:0 20px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line)}.brand{font:800 28px 'Noto Kufi Arabic',sans-serif}.brand i{color:var(--acc);font-style:normal}nav,.lang{display:flex;gap:6px;flex-wrap:wrap}nav a,.lang button{border:1px solid var(--line);background:none;color:var(--mut);padding:7px 12px;border-radius:20px;cursor:pointer;font:14px Tajawal,sans-serif}nav a[aria-current=page],.lang button[aria-pressed=true]{background:var(--acc);color:#04201d;border-color:var(--acc);font-weight:700}.hero{padding:38px 0 20px}.hero h1{margin:0;font:800 clamp(28px,4vw,46px)/1.5 'Noto Kufi Arabic',sans-serif}.hero p{color:var(--mut);max-width:720px}.sec{display:flex;align-items:center;gap:14px;margin:20px 0}.sec:after{content:'';height:1px;background:var(--line);flex:1}.books-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:45px}.book{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.25s}.book:hover{transform:translateY(-5px);box-shadow:0 18px 35px #0005}.cover{height:170px;display:grid;place-items:center;padding:20px;text-align:center;background:linear-gradient(145deg,var(--bg2),#253953);border-bottom:1px solid var(--line)}.cover h2{font:800 20px/1.5 'Noto Kufi Arabic',sans-serif}.book-body{padding:16px}.author{color:var(--acc);font-size:13px;font-weight:700}.book p{color:var(--mut);font-size:14px;margin:8px 0 14px}.read{display:inline-block;border:1px solid var(--acc);color:var(--acc);padding:7px 12px;border-radius:8px;font-size:14px;font-weight:700}.read:hover{background:var(--acc);color:#04201d}.view[hidden]{display:none}.note{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 16px;color:var(--mut);font-size:14px}footer{border-top:1px solid var(--line);padding:24px;color:var(--mut)}
@media(max-width:850px){.books-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.wrap{padding:0 14px}.books-grid{grid-template-columns:1fr}.hero{padding-top:24px}.lang{width:100%}}
</style>

};
let lang='ar';const root=document.documentElement;
