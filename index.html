<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1623">
<title>الأفق | أخبار سياسية</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1623;--bg2:#162236;--ink:#eef2f8;--mut:#9fb0c8;--line:#27364d;--acc:#2ec4b6;--hot:#ff5a4f;--card:#142033;color-scheme:dark}:root[data-theme=light]{--bg:#f1f3f7;--bg2:#e3e8f0;--ink:#101a2b;--mut:#51627c;--line:#cbd4e2;--card:#fff;--acc:#0a8f84;--hot:#d6372d;color-scheme:light}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 Tajawal,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line)}.brand{font:800 28px 'Noto Kufi Arabic',sans-serif}.brand i{color:var(--acc);font-style:normal}nav,.lang{display:flex;gap:5px;flex-wrap:wrap}nav a,.lang button,.theme{border:1px solid transparent;background:none;color:var(--mut);padding:6px 10px;border-radius:20px;cursor:pointer;font:500 14px Tajawal,sans-serif}nav a[aria-current=page],.lang button[aria-pressed=true]{background:var(--acc);color:#04201d;font-weight:700}.lang button,.theme{border-color:var(--line)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;padding:44px 0 36px}.hero h1{font:800 clamp(30px,4.6vw,54px)/1.5 'Noto Kufi Arabic',sans-serif;margin:0}.hero p{color:var(--mut)}.tag{display:inline-block;background:var(--hot);color:white;padding:3px 12px;border-radius:8px;font-weight:700}.btn{display:inline-block;background:var(--acc);color:#04201d;padding:10px 20px;border-radius:10px;font-weight:700}.stage{height:340px;display:grid;place-items:center;perspective:900px}.globe{position:relative;width:min(280px,70vw);aspect-ratio:1;transform-style:preserve-3d;animation:spin 26s linear infinite}.globe i{position:absolute;inset:0;border:1.5px solid var(--acc);border-radius:50%;opacity:.7}.globe i:nth-child(2){transform:rotateY(30deg)}.globe i:nth-child(3){transform:rotateY(60deg)}.globe i:nth-child(4){transform:rotateY(90deg)}.globe i:nth-child(5){transform:rotateY(120deg)}.globe i:nth-child(6){transform:rotateY(150deg)}.globe i:nth-child(7){inset:15% 0;transform:rotateX(90deg)}.globe i:nth-child(8){inset:40% 0;transform:rotateX(90deg);border-color:var(--hot)}@keyframes spin{to{transform:rotateY(360deg)}}
.sec{display:flex;align-items:center;gap:14px}.sec:after{content:'';height:1px;background:var(--line);flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:20px 0 44px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}.card small{color:var(--acc);font-weight:700}.card h2{font-size:20px}.card p{color:var(--mut)}.card.wide{grid-column:span 2}.view[hidden]{display:none}.live-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:28px 0 14px}.badge{background:var(--hot);color:white;padding:4px 14px;border-radius:20px;font-weight:700}.clock{color:var(--mut)}
.stream-shell{position:relative;width:100%;aspect-ratio:16/9;min-height:420px;margin:12px 0 24px;background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden}.stream-shell iframe{width:100%;height:100%;border:0}.stream-note{color:var(--mut);font-size:14px;margin:0 0 28px}.stream-actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 28px}.tl{list-style:none;border-inline-start:2px solid var(--line);padding:0;margin:20px 0 52px}.tl li{padding:0 24px 20px;position:relative}.tl li:before{content:'';position:absolute;inset-inline-start:-7px;top:8px;width:12px;height:12px;background:var(--acc);border-radius:50%}.tl b{color:var(--acc)}.note{background:var(--bg2);padding:10px 16px;border-radius:10px;color:var(--mut);font-size:14px}footer{border-top:1px solid var(--line);padding:24px 0;color:var(--mut)}
@media(max-width:800px){.hero{grid-template-columns:1fr}.stage{height:270px}.grid{grid-template-columns:1fr 1fr}.stream-shell{min-height:300px;aspect-ratio:16/10}}@media(max-width:560px){.grid{grid-template-columns:1fr}.card.wide{grid-column:auto}.lang{width:100%}.stream-shell{min-height:220px;aspect-ratio:16/11}}@media(prefers-reduced-motion:reduce){.globe{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<header><a class="brand" href="#home">الأ<i>ف</i>ق</a><nav id="nav"></nav><div class="lang" id="lang"><button data-l="ar">العربية</button><button data-l="ku">کوردی بادینی</button><button data-l="en">English</button><button data-l="fr">Français</button></div><button class="theme" id="theme" aria-label="Theme">◐</button></header>
<section class="view" id="v-home"><div class="hero"><div><span class="tag" data-t="tag"></span><h1 data-t="h1"></h1><p data-t="hp"></p><a class="btn" href="#live" data-t="btn"></a></div><div class="stage" aria-hidden="true"><div class="globe"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div><div class="sec"><h2 data-t="latest"></h2></div><div class="grid" id="g-news"></div></section>
<section class="view" id="v-live" hidden><div class="live-head"><span class="badge" data-t="live"></span><h2 data-t="liveT"></h2><span class="clock" id="clock"></span></div><div class="stream-shell"><iframe src="https://www.youtube-nocookie.com/embed/live_stream?channel=UCrj5BGAhtWxDfqbza9T9hqA&autoplay=0&rel=0&modestbranding=1" title="بث الحدث المباشر - YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="stream-actions"><a class="btn" href="https://www.youtube.com/@AlHadath/live" target="_blank" rel="noopener noreferrer" data-t="watchYt"></a><a class="btn" href="https://www.alhadath.net/live-stream" target="_blank" rel="noopener noreferrer" data-t="watchOfficial"></a></div><p class="stream-note" data-t="streamNote"></p><ul class="tl" id="tl"></ul></section>
<section class="view" id="v-books" hidden><div class="sec"><h2 data-t="booksT"></h2></div><div class="grid" id="g-books"></div></section><section class="view" id="v-ai" hidden><div class="sec"><h2 data-t="aiT"></h2></div><div class="grid" id="g-ai"></div></section><p class="note" data-t="note"></p></div><footer><div class="wrap" data-t="foot"></div></footer>
<script>
const D={
ar:{dir:'rtl',loc:'ar-IQ',title:'الأفق | أخبار سياسية',nav:['الرئيسية','مباشر','كتب وبحوث','ذكاء اصطناعي'],tag:'الخبر الرئيسي',h1:'عنوان الخبر السياسي الأبرز يظهر هنا',hp:'مقدمة قصيرة تلخّص الخبر: ماذا حدث ومن المعني وما الذي يترقبه القراء.',btn:'تابع البث المباشر',latest:'آخر الأخبار',live:'مباشر',liveT:'التغطية المباشرة',watchYt:'شاهد على يوتيوب',watchOfficial:'الموقع الرسمي',streamNote:'البث يظهر داخل الصفحة عبر البث الرسمي لقناة الحدث على YouTube.',booksT:'كتب وبحوث',aiT:'ذكاء اصطناعي',note:'العناوين والتحديثات المعروضة تجريبية وليست أخباراً حقيقية.',foot:'© 2026 الأفق. جميع الحقوق محفوظة.',news:[['محلي','عنوان خبر محلي رئيسي تجريبي','قبل ساعة',1],['إقليمي','عنوان خبر إقليمي تجريبي','قبل ساعتين'],['دولي','عنوان خبر دولي تجريبي','قبل 3 ساعات'],['اقتصاد','عنوان خبر اقتصادي تجريبي','قبل 4 ساعات']],liveL:[['14:20','تحديث تجريبي: أحدث ما وصل إلى غرفة الأخبار.'],['13:45','تحديث تجريبي: تصريح رسمي جديد قيد المراجعة.']],books:[['كتاب','كتاب تجريبي عن السياسة في المنطقة','وصف قصير للكتاب.']],ai:[['ذكاء اصطناعي','الذكاء الاصطناعي في غرف الأخبار','محتوى تجريبي.']]},
ku:{dir:'rtl',loc:'ku',title:'ئاسۆ | هەڤاڵییێن سیاسی',nav:['دەستپێک','ڕاستەوخۆ','کتێب و ڤەکۆلین','زیرەکییا دەستکرد'],tag:'هەڤاڵییا سەرەکی',h1:'سەرناڤێ گرنگترین هەڤاڵییا سیاسی ل ڤێرە دەردکەڤیت',hp:'کورتەیا هەڤاڵییێ و چ پێشبینی دکرێت.',btn:'بەدوماهییا راستەوخۆ',latest:'هەڤاڵییێن نوو',live:'ڕاستەوخۆ',liveT:'هەڤاڵییێن ڕاستەوخۆ',watchYt:'ل سەر یوتوب ببینە',watchOfficial:'مالپەڕا فەرمی',streamNote:'پەخشەکە د ناڤ مالپەرێ ئاسۆ دا یوتوبە.',booksT:'کتێب و ڤەکۆلین',aiT:'زیرەکییا دەستکرد',note:'هەڤاڵی و نووکرنێن ل ڤێرە نموونەن.',foot:'© 2026 ئاسۆ.',news:[['ناوخۆیی','سەرناڤەکا نموونە یا ناوخۆیی','ساەتەک بەرێ',1],['هەرێمی','سەرناڤەکا نموونە یا هەرێمی','دوو ساەت بەرێ']],liveL:[['14:20','نووکرنەکا نموونە: هەڤاڵییێن نوو گەهشتن.']],books:[['کتێب','کتێبەکا نموونە دەربارەی سیاسەت','ناسینەکا کورت.']],ai:[['زیرەکییا دەستکرد','زیرەکییا دەستکرد ل ژوورێن هەڤاڵیان','ناڤەرۆکێ نموونە.']]},
en:{dir:'ltr',loc:'en-GB',title:'Horizon | Political News',nav:['Home','Live','Books & Research','AI'],tag:'Top story',h1:'The leading political headline appears here',hp:'A short introduction summarising what happened and what readers should watch next.',btn:'Follow live coverage',latest:'Latest news',live:'LIVE',liveT:'Live coverage',watchYt:'Watch on YouTube',watchOfficial:'Official website',streamNote:'The stream appears inside the Horizon website through Al Hadath’s official YouTube channel.',booksT:'Books & Research',aiT:'Artificial Intelligence',note:'Headlines and updates shown here are sample content.',foot:'© 2026 Horizon.',news:[['Local','Sample local lead story','1 hour ago',1],['World','Sample world headline','3 hours ago']],liveL:[['14:20','Sample update: the latest information reached the newsroom.']],books:[['Book','Sample book on regional politics','A short sample description.']],ai:[['AI','Artificial intelligence in newsrooms','Sample content.']]},
fr:{dir:'ltr',loc:'fr-FR',title:'Horizon | Actualités politiques',nav:['Accueil','Direct','Livres & recherches','IA'],tag:'À la une',h1:'Le grand titre politique apparaît ici',hp:'Une courte introduction résume les faits et les prochains enjeux.',btn:'Suivre le direct',latest:'Dernières nouvelles',live:'DIRECT',liveT:'Couverture en direct',watchYt:'Voir sur YouTube',watchOfficial:'Site officiel',streamNote:'Le direct apparaît dans le site Horizon via la chaîne officielle YouTube d’Al Hadath.',booksT:'Livres & recherches',aiT:'Intelligence artificielle',note:'Les titres et mises à jour sont des exemples.',foot:'© 2026 Horizon.',news:[['Local','Titre local exemple','Il y a 1 heure',1],['International','Titre international exemple','Il y a 3 heures']],liveL:[['14:20','Mise à jour exemple : les dernières informations sont arrivées.']],books:[['Livre','Exemple de livre sur la politique régionale','Brève description.']],ai:[['IA','L’intelligence artificielle dans les rédactions','Contenu exemple.']]}
};
const V=['home','live','books','ai'];let L='ar';const root=document.documentElement;
function card(n){return '<article class="card'+(n[3]?' wide':'')+'"><small>'+n[0]+'</small><h2>'+n[1]+'</h2><p>'+n[2]+'</p></article>'}
function clock(){const e=document.getElementById('clock');if(e)e.textContent=new Date().toLocaleTimeString(D[L].loc)}
function route(){let h=(location.hash||'#home').slice(1);if(!V.includes(h))h='home';V.forEach(v=>document.getElementById('v-'+v).hidden=v!==h);document.getElementById('nav').innerHTML=V.map((v,i)=>'<a href="#'+v+'"'+(h===v?' aria-current="page"':'')+'>'+D[L].nav[i]+'</a>').join('')}
function render(){const d=D[L];root.lang=L;root.dir=d.dir;document.title=d.title;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=d[e.dataset.t]);document.getElementById('g-news').innerHTML=d.news.map(card).join('');document.getElementById('g-books').innerHTML=d.books.map(card).join('');document.getElementById('g-ai').innerHTML=d.ai.map(card).join('');document.getElementById('tl').innerHTML=d.liveL.map(n=>'<li><b>'+n[0]+'</b><p>'+n[1]+'</p></li>').join('');document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));route();clock()}
document.getElementById('lang').addEventListener('click',e=>{const l=e.target.dataset.l;if(D[l]){L=l;try{localStorage.setItem('lang',l)}catch(x){}render()}});try{const l=localStorage.getItem('lang');if(D[l])L=l}catch(x){}
document.getElementById('theme').addEventListener('click',()=>{root.dataset.theme=root.dataset.theme==='light'?'dark':'light'});addEventListener('hashchange',route);setInterval(clock,1000);render();
</script>
</body>
</html>
