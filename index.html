<style>
:root{--bg:#0e1623;--bg2:#162236;--ink:#eef2f8;--mut:#9fb0c8;--line:#27364d;--acc:#2ec4b6;--hot:#ff5a4f;--card:#142033;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1623;--bg2:#162236;--ink:#eef2f8;--mut:#9fb0c8;--line:#27364d;--card:#142033;color-scheme:dark}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f3f7;--bg2:#e3e8f0;--ink:#101a2b;--mut:#51627c;--line:#cbd4e2;--card:#fff;--acc:#0a8f84;--hot:#d6372d}}
:root[data-theme="dark"]{--bg:#0e1623;--bg2:#162236;--ink:#eef2f8;--mut:#9fb0c8;--line:#27364d;--card:#142033;color-scheme:dark}
:root[data-theme="light"]{--bg:#f1f3f7;--bg2:#e3e8f0;--ink:#101a2b;--mut:#51627c;--line:#cbd4e2;--card:#fff;--acc:#0a8f84;--hot:#d6372d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.8 Tajawal,"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:"Noto Kufi Arabic","Noto Sans Arabic",Tajawal,sans-serif;line-height:1.5;margin:0}
.ticker{background:var(--hot);color:#fff;font-weight:700;font-size:15px;display:flex;overflow:hidden;white-space:nowrap}
.ticker b{background:#0003;padding:6px 16px;flex:none}
.ticker div{display:inline-block;padding:6px 0;animation:run 40s linear infinite}
.ticker span{margin:0 28px}
@keyframes run{from{transform:translateX(-100%)}to{transform:translateX(0)}}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}.brand svg{flex:none;border-radius:10px}
.logo{font:800 30px "Noto Kufi Arabic",sans-serif;letter-spacing:0}
.logo i{color:var(--acc);font-style:normal}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,.theme{background:none;border:1px solid transparent;color:var(--mut);font:500 16px Tajawal,sans-serif;padding:6px 14px;border-radius:99px;cursor:pointer}
nav button:hover{color:var(--ink)}
nav button[aria-pressed="true"]{background:var(--acc);color:#04201d;font-weight:700}
.theme{border-color:var(--line)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;padding:44px 0 36px}
.hero h1{font-size:clamp(30px,4.6vw,54px);font-weight:800}
.hero p{color:var(--mut);max-width:52ch;margin:14px 0 20px}
.tag{display:inline-block;background:var(--hot);color:#fff;font-weight:700;font-size:14px;padding:2px 12px;border-radius:6px;margin-bottom:12px}
.btn{display:inline-block;background:var(--acc);color:#04201d;font-weight:700;padding:10px 22px;border-radius:10px}
.stage{perspective:900px;height:380px;display:grid;place-items:center}
.globe{position:relative;width:300px;height:300px;transform-style:preserve-3d;animation:spin 26s linear infinite}
.globe i{position:absolute;inset:0;border:1.5px solid var(--acc);border-radius:50%;opacity:.75}
.globe i:nth-child(1){transform:rotateY(0)}.globe i:nth-child(2){transform:rotateY(30deg)}.globe i:nth-child(3){transform:rotateY(60deg)}
.globe i:nth-child(4){transform:rotateY(90deg)}.globe i:nth-child(5){transform:rotateY(120deg)}.globe i:nth-child(6){transform:rotateY(150deg)}
.globe i:nth-child(7){inset:14% 0;transform:rotateX(90deg)}.globe i:nth-child(8){inset:38% 0;transform:rotateX(90deg) translateZ(0);border-color:var(--hot)}
.globe::after{content:"";position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--acc),transparent 70%);filter:blur(18px);opacity:.55}
.stage{transform:rotateX(-14deg)}
@keyframes spin{to{transform:rotateY(360deg)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:8px 0 56px;perspective:1100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;transform-style:preserve-3d;transition:transform .25s,box-shadow .25s;will-change:transform}
.card:hover{box-shadow:0 22px 40px #0006}
.card small{color:var(--acc);font-weight:700}
.card h3{font-size:20px;margin:8px 0 10px;transform:translateZ(26px)}
.card p{margin:0 0 12px;color:var(--mut);font-size:16px;transform:translateZ(12px)}
.card time{color:var(--mut);font-size:14px}
.card.wide{grid-column:span 2;background:linear-gradient(135deg,var(--bg2),var(--card))}
.card.wide h3{font-size:26px}
.card[hidden]{display:none}
.sec{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.sec h2{font-size:24px}.sec::after{content:"";flex:1;height:1px;background:var(--line)}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--mut);font-size:15px}
.note{background:var(--bg2);border-radius:10px;padding:10px 16px;font-size:14px;color:var(--mut);margin:18px 0 0}
@media (max-width:860px){.hero{grid-template-columns:1fr}.stage{height:300px}.globe{width:230px;height:230px}.grid{grid-template-columns:1fr 1fr}.card.wide{grid-column:span 2}}
@media (max-width:560px){.grid{grid-template-columns:1fr}.card.wide{grid-column:auto}}
@media (prefers-reduced-motion:reduce){.globe,.ticker div{animation:none}.card{transition:none}}

.top{flex-wrap:wrap}
nav a{color:var(--mut);font:500 16px Tajawal,sans-serif;padding:6px 14px;border-radius:99px}
nav a:hover{color:var(--ink)}nav a[aria-current="page"]{background:var(--acc);color:#04201d;font-weight:700}
.lang{display:flex;gap:4px}.lang button{background:none;border:1px solid var(--line);color:var(--mut);font:500 14px Tajawal,sans-serif;padding:4px 10px;border-radius:8px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.view[hidden]{display:none}
.live-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:34px 0 14px}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--hot);color:#fff;font-weight:800;padding:4px 14px;border-radius:99px}
.badge::before{content:"";width:10px;height:10px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.clock{color:var(--mut);font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:10px 0 56px;padding:0;border-inline-start:2px solid var(--line)}
.tl li{position:relative;padding:0 26px 26px}
.tl li::before{content:"";position:absolute;inset-inline-start:-7px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--acc)}
.tl li:first-child::before{background:var(--hot)}
.tl b{color:var(--acc);font-variant-numeric:tabular-nums}
.tl p{margin:2px 0 0}
.card .k{color:var(--hot)}
[dir=ltr] .ticker div{animation-name:runl}
@keyframes runl{from{transform:translateX(0)}to{transform:translateX(-100%)}}
</style>
</head>

</div>

function clock(){document.getElementById("clock").textContent=new Date().toLocaleTimeString(D[L].loc)}
addEventListener("hashchange",route);setInterval(clock,1000);
document.getElementById("lang").addEventListener("click",function(e){var l=e.target.dataset.l;if(l){L=l;try{localStorage.setItem("lang",l)}catch(x){}render()}});
try{var sv=localStorage.getItem("lang");if(D[sv])L=sv}catch(x){}
var rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
if(!rm)document.addEventListener("pointermove",function(e){var k=e.target.closest&&e.target.closest(".card");if(!k)return;var r=k.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;k.style.transform="rotateY("+(x*12)+"deg) rotateX("+(-y*12)+"deg) translateZ(8px)"});
document.addEventListener("pointerout",function(e){var k=e.target.closest&&e.target.closest(".card");if(k)k.style.transform=""});
document.getElementById("theme").addEventListener("click",function(){var dk=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;root.dataset.theme=dk?"light":"dark"});
render();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
</body>
</html>
