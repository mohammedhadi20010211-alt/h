<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1623"><meta name="description" content="شاهد بث رووداو المباشر داخل موقع الأفق."><title>الأفق | بث رووداو المباشر</title>
<style>
:root{--bg:#0e1623;--card:#142033;--line:#27364d;--ink:#eef2f8;--mut:#9fb0c8;--acc:#2ec4b6;--bad:#ff847a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 Tahoma,Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:0 18px}header{padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}a{color:var(--acc);text-decoration:none}.hero{padding:24px 0 12px}.player-box{position:relative;width:100%;aspect-ratio:16/9;min-height:280px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#080d14}.player-box video{width:100%;height:100%;object-fit:contain;background:#080d14}.status{min-height:48px;margin:10px 0;color:var(--mut);font-size:14px}.status.error{color:var(--bad)}.button{display:inline-block;background:var(--acc);color:#06201d;font-weight:bold;padding:10px 16px;border-radius:9px;margin:8px 0}footer{margin-top:24px;padding:18px 0;border-top:1px solid var(--line);color:var(--mut);font-size:14px}@media(max-width:600px){.player-box{aspect-ratio:auto;height:55vh}}
</style></head>
<body><div class="wrap">
<header><a href="./">الأفق</a><a href="./news.html">الأخبار</a></header>
<main><section class="hero"><h1>شاهد البث المباشر — رووداو</h1><p>المشغل مصمم لعرض البث داخل الصفحة نفسها بدل فتح الموقع الخارجي داخل إطار.</p><a class="button" id="open" href="https://www.rudaw.net/english/live-tv" target="_blank" rel="noopener noreferrer">فتح البث في صفحة رووداو ↗</a></section>
<div class="player-box"><video id="video" controls autoplay muted playsinline preload="none"></video></div><div class="status" id="status" aria-live="polite">جارٍ الاتصال ببث رووداو المباشر…</div>
</main><footer>البث والمحتوى تابعان لقناة رووداو. قد يمنع مزود البث التشغيل في متصفحات معينة أو خارج نطاقه.</footer></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
<script>
const video=document.getElementById('video');
const status=document.getElementById('status');
const streams=['https://live.rudaw.net/hls/rudaw-tv/master.m3u8','https://hlspackager.akamaized.net/live/DB/RUDAW/HLS/RUDAW.m3u8'];
let streamIndex=0;
function failed(){streamIndex++;if(streamIndex<streams.length){status.textContent='جارٍ تجربة مصدر بث بديل…';play(streams[streamIndex]);}else{status.className='status error';status.textContent='تعذر تشغيل البث المباشر حاليًا. افتح صفحة رووداو مباشرة بالزر أعلاه.'}}
function play(url){video.pause();if(window.Hls&&Hls.isSupported()){if(window.currentHls)window.currentHls.destroy();const hls=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:30});window.currentHls=hls;hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>{status.textContent='البث متصل.';const playPromise=video.play();if(playPromise)playPromise.catch(()=>{status.textContent='اضغط تشغيل في مشغل الفيديو لبدء البث.'})});hls.on(Hls.Events.ERROR,(event,data)=>{if(data.fatal)failed()})}else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.addEventListener('canplay',()=>{status.textContent='البث متصل.';video.play().catch(()=>{status.textContent='اضغط تشغيل في مشغل الفيديو لبدء البث.'})},{once:true});video.addEventListener('error',failed,{once:true})}else{status.className='status error';status.textContent='متصفحك لا يدعم البث المباشر HLS؛ افتح الرابط مباشرة.'}}
play(streams[0]);
</script></body></html>
