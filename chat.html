<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1623"><title>الأفق | محادثة Gemini</title>
<style>
:root{--bg:#0e1623;--card:#142033;--line:#27364d;--ink:#eef2f8;--mut:#9fb0c8;--acc:#2ec4b6;--bad:#ff847a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Tahoma,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:0 16px}header{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}header a{color:var(--acc);text-decoration:none}.brand{font-size:24px;font-weight:bold}.chat{height:calc(100vh - 230px);min-height:320px;display:flex;flex-direction:column;margin:18px 0}.messages{flex:1;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:14px 14px 0 0;background:#0b121d}.msg{max-width:86%;margin:10px 0;padding:10px 13px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}.user{margin-right:auto;background:var(--acc);color:#05201d}.bot{margin-left:auto;background:var(--card);border:1px solid var(--line)}.composer{display:flex;gap:8px;border:1px solid var(--line);border-top:0;padding:8px;border-radius:0 0 14px 14px}.composer textarea{flex:1;resize:vertical;min-height:50px;max-height:140px;border:0;outline:0;background:transparent;color:var(--ink);font:16px Tahoma,Arial,sans-serif}.composer button{border:0;border-radius:9px;background:var(--acc);color:#05201d;padding:0 18px;font-weight:bold;cursor:pointer}.composer button:disabled{opacity:.6;cursor:not-allowed}.note{color:var(--mut);font-size:14px}.error{color:var(--bad)}
</style></head>
<body><div class="wrap">
<header><a class="brand" href="./">الأفق</a><a href="./ai.html">صفحة الذكاء الاصطناعي</a></header>
<h1>محادثة Gemini</h1>
<div class="chat"><div class="messages" id="messages" aria-live="polite"><div class="msg bot">مرحبًا! اكتب رسالتك وسأرد عليك عبر Gemini.</div></div><div class="composer"><textarea id="input" placeholder="اكتب رسالتك هنا…" aria-label="رسالتك"></textarea><button id="send">إرسال</button></div></div>
<p class="note" id="status">تعمل المحادثة بعد نشر الموقع على Cloudflare Pages وإضافة السر GEMINI_API_KEY. لا تضع المفتاح في ملفات الموقع.</p>
</div>
<script>
const API_ENDPOINT='./api/chat';
const messagesEl=document.getElementById('messages');
const input=document.getElementById('input');
const send=document.getElementById('send');
const status=document.getElementById('status');
const history=[];
function add(text,kind){const el=document.createElement('div');el.className='msg '+kind;el.textContent=text;messagesEl.appendChild(el);messagesEl.scrollTop=messagesEl.scrollHeight;return el}
async function submit(){const text=input.value.trim();if(!text||send.disabled)return;input.value='';add(text,'user');history.push({role:'user',content:text});const answer=add('جاري الكتابة…','bot');send.disabled=true;
 try{const response=await fetch(API_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`تعذر الاتصال بالخادم (${response.status}).`);if(typeof data.reply!=='string'||!data.reply.trim())throw new Error('لم يصل رد من Gemini.');answer.textContent=data.reply;history.push({role:'assistant',content:data.reply});status.textContent='متصل بـGemini.';status.classList.remove('error')}
 catch(error){answer.classList.add('error');answer.textContent=error.message||'تعذر الاتصال. تأكد من نشر الموقع على Cloudflare Pages وإعداد GEMINI_API_KEY.';history.pop();status.textContent='المحادثة تحتاج Cloudflare Pages Function وسر GEMINI_API_KEY.';status.classList.add('error')}
 finally{send.disabled=false;input.focus()}}
send.addEventListener('click',submit);input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submit()}});
</script></body></html>
